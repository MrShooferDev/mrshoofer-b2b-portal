# Marketing + static portals

server {
  listen 80;
  listen 8080;
  server_name shoofer.taxi;

  # Docker embedded DNS — resolves at request time
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $marketing_upstream http://marketing:3000;

  location / {
    proxy_pass $marketing_upstream;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}

server {
  listen 80;
  listen 8080;
  server_name www.shoofer.taxi;

  return 301 https://shoofer.taxi$request_uri;
}

server {
  listen 80;
  listen 8080;
  server_name apidocs.shoofer.taxi;

  location / {
    proxy_pass http://apidocs_backend;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}

server {
  listen 80;
  listen 8080;
  server_name docs.shoofer.taxi;

  location / {
    proxy_pass http://docs_backend;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}

server {
  listen 80;
  listen 8080;
  server_name driver.shoofer.taxi;

  location / {
    proxy_pass http://driver_web_backend;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}
