# Internal health for the edge container itself
server {
  listen 80 default_server;
  listen 8080 default_server;
  server_name _;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Fail closed for unknown Host headers
  location / {
    return 444;
  }
}
