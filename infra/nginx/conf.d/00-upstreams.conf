# Docker DNS service names (compose network: shoofer)

upstream ors_backend {
  server ors:5000;
  keepalive 16;
}

upstream agency_backend {
  server agency:5005;
  keepalive 16;
}

upstream org_backend {
  server org:5055;
  keepalive 16;
}

# Marketing is optional (compose profile). Use a variable so nginx starts
# even when the marketing container is not running.
# upstream resolved at request time via Docker DNS.

upstream apidocs_backend {
  server apidocs:80;
}

upstream docs_backend {
  server docs:80;
}

upstream driver_web_backend {
  server driver-web:80;
}

upstream driver_api_backend {
  server driver:57679;
  keepalive 8;
}
