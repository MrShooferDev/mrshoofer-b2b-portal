# Sale / public site — mrshoofer.com (+ .ir redirect)

server {
  listen 80;
  listen 8080;
  server_name mrshoofer.com www.mrshoofer.com;

  location / {
    proxy_pass http://org_backend;
    include /etc/nginx/snippets/proxy_params.conf;
    # Arvan often terminates TLS; tell the app the original scheme
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}

server {
  listen 80;
  listen 8080;
  server_name mrshoofer.ir www.mrshoofer.ir;

  return 301 https://mrshoofer.com$request_uri;
}

# pay.mrshoofer.ir — adjust if payment has a dedicated upstream later
server {
  listen 80;
  listen 8080;
  server_name pay.mrshoofer.ir;

  location / {
    proxy_pass http://org_backend;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}

server {
  listen 80;
  listen 8080;
  server_name sale.shoofer.taxi sale.mrshoofer.com;

  return 301 https://mrshoofer.com$request_uri;
}
