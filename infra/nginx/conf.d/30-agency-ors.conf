# Agency panel + ORS

server {
  listen 80;
  listen 8080;
  server_name agency.shoofer.taxi;

  location / {
    proxy_pass http://agency_backend;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}

server {
  listen 80;
  listen 8080;
  server_name ors.shoofer.taxi mrbilit.shoofer.taxi;

  location / {
    proxy_pass http://ors_backend;
    include /etc/nginx/snippets/proxy_params.conf;
  }
}
