# =============================================================================
# Shoofer platform — Docker Compose (builds from each repo's latest source)
# =============================================================================
#
# Build contexts (set in .env):
#   ORS_SRC     → MrShoofer-ORS (repo Dockerfile)
#   ORG_SRC     → ORG / Sale (repo Dockerfile)
#   AGENCY_SRC  → MrShoofer-enterprise-selling (repo Dockerfile)
#   MARKETING_SRC → shoofer-agency-landing (repo Dockerfile)
#   Driver still uses infra/services/driver (publish wrap; no dedicated repo here)
#
# Secrets: ConnectionStrings__* and app keys come from .env (never bake into git).
# =============================================================================

name: shoofer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [shoofer]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ORG}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1GB}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [shoofer]
    depends_on:
      - ors
      - agency
      - org
      - apidocs
      - docs
      - driver-web
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    cpus: "0.25"

  # --- ORS: build from MrShoofer-ORS Dockerfile (latest branch checked out into ORS_SRC)
  ors:
    build:
      context: ${ORS_SRC:?set ORS_SRC in .env}
      dockerfile: Dockerfile
    image: shoofer-ors:latest
    restart: unless-stopped
    networks: [shoofer]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      TZ: Asia/Tehran
      ConnectionStrings__PostgreSQL: ${ORS_CONNECTION_STRING:?}
      ConnectionStrings__Dep: Data Source=/data/Carpooldev.db;
    volumes:
      - ors_data:/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_reservation: 512m
    mem_limit: ${ORS_MEM_LIMIT:-1536m}
    cpus: ${ORS_CPUS:-1.0}
    oom_score_adj: -500

  # --- Agency: MrShoofer-enterprise-selling root Dockerfile
  agency:
    build:
      context: ${AGENCY_SRC:?set AGENCY_SRC in .env}
      dockerfile: Dockerfile
    image: shoofer-agency:latest
    restart: unless-stopped
    networks: [shoofer]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5005
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      ConnectionStrings__production: ${AGENCY_CONNECTION_STRING:?}
      ConnectionStrings__development: ${AGENCY_CONNECTION_STRING:?}
      smsirapikey: ${SMS_IR_API_KEY:-}
      smsirlinenumber: ${SMS_IR_LINE_NUMBER:-}
    expose:
      - "5005"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5005'"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: ${AGENCY_MEM_LIMIT:-768m}
    cpus: ${AGENCY_CPUS:-0.75}
    oom_score_adj: -200

  # --- Sale / ORG: ORG repo Dockerfile
  org:
    build:
      context: ${ORG_SRC:?set ORG_SRC in .env}
      dockerfile: Dockerfile
    image: shoofer-org:latest
    restart: unless-stopped
    networks: [shoofer]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5055
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      ConnectionStrings__production: ${ORG_CONNECTION_STRING:?}
      ConnectionStrings__development: ${ORG_CONNECTION_STRING:?}
      smsirapikey: ${SMS_IR_API_KEY:-}
      smsirlinenumber: ${SMS_IR_LINE_NUMBER:-}
    expose:
      - "5055"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5055'"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: ${ORG_MEM_LIMIT:-768m}
    cpus: ${ORG_CPUS:-0.75}
    oom_score_adj: -300

  # --- Driver API: publish wrap (no dedicated git repo wired yet)
  driver:
    build:
      context: ./services/driver
      dockerfile: Dockerfile
    image: shoofer-driver:latest
    restart: unless-stopped
    networks: [shoofer]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:57679
      DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
      ConnectionStrings__DefaultConnection: ${DRIVER_CONNECTION_STRING:?}
    expose:
      - "57679"
    mem_limit: ${DRIVER_MEM_LIMIT:-512m}
    cpus: ${DRIVER_CPUS:-0.5}
    oom_score_adj: -100

  # --- Marketing: shoofer-agency-landing Dockerfile
  marketing:
    profiles: ["marketing"]
    build:
      context: ${MARKETING_SRC:?set MARKETING_SRC in .env}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RECAPTCHA_V2_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_V2_SITE_KEY:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_POSTHOG_UI_HOST: ${NEXT_PUBLIC_POSTHOG_UI_HOST:-https://us.posthog.com}
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-}
        NEXT_PUBLIC_POSTHOG_SESSION_RECORDING: ${NEXT_PUBLIC_POSTHOG_SESSION_RECORDING:-}
        NEXT_PUBLIC_POSTHOG_AUTOCAPTURE: ${NEXT_PUBLIC_POSTHOG_AUTOCAPTURE:-}
        NEXT_PUBLIC_POSTHOG_WEB_VITALS: ${NEXT_PUBLIC_POSTHOG_WEB_VITALS:-}
    image: shoofer-marketing:latest
    restart: unless-stopped
    networks: [shoofer]
    env_file:
      - ${MARKETING_ENV_FILE:-./.env.marketing}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/app/storage/shoofer.db
    volumes:
      - marketing_storage:/app/storage
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/robots.txt',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: ${MARKETING_MEM_LIMIT:-512m}
    cpus: ${MARKETING_CPUS:-0.5}

  apidocs:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [shoofer]
    volumes:
      - ./static/apidocs:/usr/share/nginx/html:ro
      - ./nginx/static-default.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    mem_limit: 64m
    cpus: "0.1"

  docs:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [shoofer]
    volumes:
      - ./static/docs:/usr/share/nginx/html:ro
      - ./nginx/static-default.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    mem_limit: 64m
    cpus: "0.1"

  driver-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [shoofer]
    volumes:
      - ./static/driver-web:/usr/share/nginx/html:ro
      - ./nginx/static-default.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["80"]
    mem_limit: 64m
    cpus: "0.1"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    networks: [shoofer]
    volumes:
      - kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: ${KUMA_MEM_LIMIT:-256m}
    cpus: ${KUMA_CPUS:-0.25}
    oom_score_adj: 200

networks:
  shoofer:
    driver: bridge

volumes:
  pgdata:
    name: shoofer_pgdata
  marketing_storage:
    name: shoofer_marketing_storage
  kuma_data:
    name: shoofer_kuma_data
  ors_data:
    name: shoofer_ors_data
